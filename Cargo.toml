[package]
name = "bq25773"
version = "0.2.0"
repository = "https://github.com/OpenDevicePartnership/bq25773"
license = "MIT"
description = "Platform-agnostic Rust driver for the Texas Instruments BQ25773 battery charge controller."
readme = "README.md"
keywords = ["battery", "charger", "i2c", "driver", "embedded-hal"]
categories = ["embedded", "hardware-support", "no-std"]
documentation = "https://docs.rs/bq25773"
include = ["/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/device.ddsl"]
edition = "2024"
rust-version = "1.94"

[dependencies]
device-driver = { version = "2.1.1", default-features = false }
defmt = { version = "1", optional = true }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-batteries-async = "0.3"

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", features = ["embedded-hal-async"] }
tokio = { version = "1.52.1", features = ["rt", "macros"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
correctness = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
pedantic = "deny"
perf = "deny"
suspicious = "deny"
style = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[features]
defmt = [
	"dep:defmt",
	"device-driver/defmt",
	"embedded-batteries-async/defmt",
]
