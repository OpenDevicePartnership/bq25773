# Keep src/device.rs in sync with device.ddsl.
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: device-driver-pregen-check
jobs:
  device-driver-pregen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: device-driver-pregen-check
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Check generated device driver
        uses: tullom/device-driver-pregen-check@v1.1.0
        with:
          source: device.ddsl
          generated-file: src/device.rs
          rust-defmt-feature: defmt
