# Keep src/device.rs in sync with device.ddsl.
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: device-driver-pregen-check
jobs:
  device-driver-pregen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: device-driver-pregen-check
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Install generation toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt
      - name: Install pinned device-driver compiler
        # A caret range can select a newer CLI whose MSRV exceeds this toolchain.
        run: cargo install device-driver-cli --version '=2.1.1' --locked
      - name: Check generated device driver
        shell: bash
        run: |
          set -euo pipefail
          generated="$(mktemp --tmpdir=. --suffix=.rs '.device-driver-pregen.XXXXXXXX')"
          trap 'rm -f -- "$generated"' EXIT
          ddc --version
          rustfmt --version
          ddc build --source device.ddsl --output "$generated" rust --rust-defmt-feature=defmt
          rustfmt --edition 2024 --config newline_style=Unix "$generated"
          diff -u -- src/device.rs "$generated"
